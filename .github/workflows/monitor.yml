name: DMIT Premium Monitor - Stopped

on:
  push:
    branches: [main]
    paths: ['.github/workflows/monitor.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmit-premium-monitor
  cancel-in-progress: true

jobs:
  monitor:
    # Stopped after the user reported being blocked. No requests to DMIT.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "DMIT monitoring is stopped. Do not resume without user instruction."
